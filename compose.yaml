services:
  db:
    image: postgres:18-alpine
    container_name: cv-aligner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cvaligner}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgresql}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cvaligner}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_v18:
