services:
  db:
    image: postgres:18-alpine
    container_name: cv-aligner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cvaligner}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgresql}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cvaligner}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    # Pin to a community edition: localstack/localstack:latest (2026.x)
    # requires LOCALSTACK_AUTH_TOKEN and exits without a license.
    image: localstack/localstack:3.8.1
    container_name: localstack-aws
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${S3_REGION:-us-east-1}
      - EAGER_SERVICE_LOADING=1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\"' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${S3_REGION:-us-east-1}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://localstack:4566 s3api head-bucket --bucket ${S3_BUCKET:-cv-aligner-cvs} 2>/dev/null ||
      aws --endpoint-url=http://localstack:4566 s3 mb s3://${S3_BUCKET:-cv-aligner-cvs}
      "

volumes:
  postgres_data_v18:
